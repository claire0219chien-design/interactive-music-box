<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動音樂機台 - 數位紀念歌單</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: hsl(38, 64%, 88%); margin-bottom: 5px; }
        .header p { color: #ff8160; font-size: 0.9rem; margin-top: 0; }
        
        .track-list { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
        .track-card { background-color: #1e293b; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 4px solid #3b82f6; transition: 0.2s;}
        .track-card:hover { transform: translateY(-2px); border-left: 4px solid #ff8160; }
        
        .track-info .time { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;}
        .track-info .melody { font-size: 1.1rem; font-weight: bold; letter-spacing: 2px;}
        
        .btn-group { display: flex; gap: 8px; align-items: center; }
        .play-btn { background-color: #98b6e7; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .play-btn:active { background-color: #ee7542; transform: scale(0.95); }
        
        .download-btn { background-color: #0596c6; color: white; border: none; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .download-btn:hover { background-color: #ff8160; }
        .download-btn.recording { background-color: #ef4444; animation: blink 1s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎵 近期演奏紀錄</h1>
        <p>點擊播放聆聽，或點擊下載保存專屬你的音樂紀念品</p>
    </div>

    <div class="track-list" id="trackList">
        <div style="text-align: center; color: #94a3b8;">載入雲端資料中...</div>
    </div>

    <script>
        // === ☁️ Firebase 完整雲端設定 ===
        const firebaseConfig = {
            apiKey: "AIzaSyCaVWMPnGqNcjWVk0JV_-oaSeGcBTpYgHg",
            authDomain: "id-music-box.firebaseapp.com",
            projectId: "id-music-box",
            storageBucket: "id-music-box.firebasestorage.app",
            messagingSenderId: "426399592540",
            appId: "1:426399592540:web:349751d6a8360cc7b23699",
            measurementId: "G-4JBWVTHHLD",
            databaseURL: "https://id-music-box-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const trackList = document.getElementById('trackList');
        let currentAudioPlayInterval = null;
        
        // 🌟 核心修復：宣告「全域共用」的實體播放器，徹底解決手機斷音問題
        const globalPlayer = new Audio();
        const globalRecorder = new Audio();
        globalRecorder.crossOrigin = "anonymous";
        
        let audioCtx = null;
        let audioDestination = null;
        let mediaRecorder = null;
        let recorderSourceNode = null;
        let recordedChunks = [];
        let isAudioUnlocked = false; 

        // 📝 翻譯字典：將英文字母轉為宮商角徵羽
        function translateToChineseScale(melodyStr) {
            const map = { 'C': '宮', 'D': '商', 'E': '角', 'G': '徵', 'A': '羽', '?': '-' };
            return melodyStr.split('').map(char => map[char] || char).join('');
        }

        // 🔓 破解手機靜音：點擊瞬間啟動共用播放器
        function unlockMobileAudio() {
            if (!isAudioUnlocked) {
                let silentSrc = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                // 讓兩個播放器先播放 0.01 秒的空白音，取得手機的合法播放權限
                globalPlayer.src = silentSrc;
                globalPlayer.play().catch(e => {});
                globalRecorder.src = silentSrc;
                globalRecorder.play().catch(e => {});
                isAudioUnlocked = true;
            }
        }

        // 📡 監聽 Firebase 資料庫
        database.ref('performances').orderByChild('timestamp').limitToLast(10).on('value', (snapshot) => {
            trackList.innerHTML = ''; 
            let records = [];
            snapshot.forEach((child) => { records.unshift(child.val()); });
            
            if(records.length === 0) {
                trackList.innerHTML = '<div style="text-align: center; color: #94a3b8;">目前還沒有演奏紀錄喔！快去機台玩玩看！</div>';
                return;
            }

            records.forEach((record, index) => {
                let date = new Date(record.timestamp);
                let timeString = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
                
                // 將拿到的 A, C, D 翻譯成 宮商角徵羽 來顯示
                let chineseMelody = translateToChineseScale(record.melody);
                
                let card = document.createElement('div');
                card.className = 'track-card';
                card.innerHTML = `
                    <div class="track-info">
                        <div class="time">🕒 ${timeString}</div>
                        <div class="melody">${chineseMelody}</div>
                    </div>
                    <div class="btn-group">
                        <button class="play-btn" onclick="playMobileAudio('${record.melody}')">▶</button>
                        <button class="download-btn" id="dl-btn-${index}" onclick="downloadSong('${record.melody}', 'dl-btn-${index}', '${timeString}')">💾 下載</button>
                    </div>
                `;
                trackList.appendChild(card);
            });
        });

        // 📱 1. 一般的手機端播放邏輯 (修復版)
        function playMobileAudio(melodyStr) {
            unlockMobileAudio(); 
            if(currentAudioPlayInterval) clearInterval(currentAudioPlayInterval);
            
            let i = 0;
            currentAudioPlayInterval = setInterval(() => {
                if (i >= melodyStr.length) {
                    clearInterval(currentAudioPlayInterval);
                    return;
                }
                
                let note = melodyStr[i];
                let measureNum = i + 1; 
                
                if (note !== '?') {
                    let fileName = note + "-" + measureNum.toString().padStart(2, '0') + ".WAV"; 
                    // 💥 關鍵：不再創造 new Audio，而是直接替換舊卡帶的音檔！
                    globalPlayer.src = fileName;
                    globalPlayer.play().catch(e => console.log("播放失敗:", fileName));
                }
                i++; 
            }, 3000); 
        }

        // 💾 2. 動態側錄並下載音檔 (修復版)
        function downloadSong(melodyStr, buttonId, timeStr) {
            unlockMobileAudio(); 
            const btn = document.getElementById(buttonId);
            if(currentAudioPlayInterval) clearInterval(currentAudioPlayInterval);
            
            btn.disabled = true;
            btn.innerText = "錄製中..";
            btn.classList.add("recording");

            // 確保錄音環境只被建立一次
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioDestination = audioCtx.createMediaStreamDestination();
                
                // 將共用錄音播放器的聲音接上管線
                recorderSourceNode = audioCtx.createMediaElementSource(globalRecorder);
                recorderSourceNode.connect(audioCtx.destination); // 喇叭
                recorderSourceNode.connect(audioDestination);     // 側錄器
            }
            if (audioCtx.state === 'suspended') audioCtx.resume(); 

            mediaRecorder = new MediaRecorder(audioDestination.stream);
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `My_Music_${timeStr.replace(/:/g, '-')}.webm`; 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                btn.disabled = false;
                btn.innerText = "💾 下載";
                btn.classList.remove("recording");
            };

            mediaRecorder.start();

            let i = 0;
            currentAudioPlayInterval = setInterval(() => {
                if (i >= melodyStr.length) {
                    clearInterval(currentAudioPlayInterval);
                    setTimeout(() => { mediaRecorder.stop(); }, 500); 
                    return;
                }
                
                let note = melodyStr[i];
                let measureNum = i + 1; 
                
                if (note !== '?') {
                    let fileName = note + "-" + measureNum.toString().padStart(2, '0') + ".WAV";
                    // 💥 關鍵：換上新的音檔並播放，錄音管線已接好會自動側錄
                    globalRecorder.src = fileName;
                    globalRecorder.play().catch(e => console.log(e));
                }
                i++; 
            }, 3000); 
        }
    </script>
</body>
</html>
